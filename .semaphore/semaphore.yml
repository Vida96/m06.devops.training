version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - 'export LOCALSTACK_ENDPOINT=http://devops.tomfern.com:31566'
      - 'export AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}'
      - 'export AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}'
      - 'export AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}'
      - export AWS_EC2_METADATA_DISABLED=true
      - export AWS_PAGER=
      - export AWS_ENDPOINT_URL=$LOCALSTACK_ENDPOINT
      - export TF_VAR_AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
      - export TF_VAR_AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
blocks:
  - name: Initalize
    dependencies: []
    task:
      jobs:
        - name: Init stage
          commands:
            - cd 1-terraform-apply
            - echo "Initalizing run"
            - terraform init
            - 'artifact push workflow .terraform '
            - artifact push workflow .terraform.lock.hcl
      secrets:
        - name: localstack
  - name: Deploy
    dependencies:
      - Initalize
    task:
      jobs:
        - name: 'Pull '
          commands:
            - cd 1-terraform-apply
            - echo "Terraform deployment"
            - 'artifact pull workflow .terraform  '
            - artifact pull workflow .terraform.lock.hcl
            - chmod -R +x .terraform
            - 'terraform validate  '
            - echo "TF_VAR_aws_endpoint=$TF_VAR_aws_endpoint"
            - terraform console <<< "var.aws_endpoint"
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
      secrets:
        - name: localstack
  - name: Backet
    dependencies:
      - Deploy
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Use the backet
          commands:
            - echo "Deploy"
            - 'export AWS_ENDPOINT_URL=http://devops.tomfern.com:31566'
            - 'aws() {'
            - '  command aws --endpoint-url=$AWS_ENDPOINT_URL "$@"'
            - '}'
            - 'aws s3 cp README.md s3://my-test-bucket/'
            - 'aws s3 ls s3://my-test-bucket'
            - 'aws s3 rm s3://my-test-bucket/README.md'
  - name: Destroy
    dependencies:
      - Backet
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Destroy the bucket
          commands:
            - cd 1-terraform-apply
            - artifact pull workflow .terraform --force
            - artifact pull workflow .terraform.lock.hcl --force
            - artifact pull workflow terraform.tfstate --force
            - chmod -R +x .terraform
            - terraform destroy -auto-approve
